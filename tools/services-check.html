<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Verificação do carrossel de especialidades</title>
<style>
  body { font: 14px ui-monospace, Consolas, monospace; padding: 16px; }
  #frame { border: 1px solid #ccc; width: 1200px; height: 850px; }
  li.ok  { color: #2e7d32; }
  li.bad { color: #c62828; font-weight: 700; }
</style>
</head>
<body>

<h1>Carrossel de especialidades</h1>
<ul id="saida"></ul>
<iframe id="frame" src="../index.html" title="alvo"></iframe>

<script>
/* ==========================================================================
   O que este arquivo cobre, e por quê.

   O risco real deste componente não é visual — é o texto. As cinco imagens
   trazem título e descrição GRAVADOS em pixel, e pixel não é lido pelo Google
   nem por leitor de tela. O bloco .visually-hidden é a única coisa que
   sustenta esta seção para busca e acessibilidade, e é invisível por
   definição: ninguém vai notar se ele sumir numa edição futura. Por isso ele
   é verificado aqui, item por item.

   Também cobre o contrato de enriquecimento progressivo: os controles nascem
   com [hidden] e só o JS os revela. Se alguém remover o atributo do HTML, o
   site passa a mostrar setas mortas quando o script falhar — e este teste
   acusa.

   COMO RODAR — a flag não é opcional:

       chrome --headless=new --force-prefers-reduced-motion=reduce \
              --virtual-time-budget=15000 .../tools/services-check.html

   Sem ela, os três testes de navegação reprovam sem que haja defeito algum.
   Motivo, reproduzido com código nativo mínimo (um div com overflow e três
   filhos, sem nada do projeto):

       scrollTo({left:300, behavior:'smooth'})  ->  scrollLeft = 0
       scrollTo({left:600, behavior:'auto'})    ->  scrollLeft = 576

   Rolagem suave corre no timeline de animação, que fica congelado sob
   --virtual-time-budget — a mesma limitação já registrada para a WAAPI. Com a
   flag, o componente cai no caminho de movimento reduzido (behavior:'auto') e
   a lógica de verdade — irPara, indiceVisivel, sincronizar — passa a ser
   exercitada. Testar o caminho reduzido também tem valor próprio: é o que
   pessoas com sensibilidade a movimento realmente recebem.
   ========================================================================== */
(function () {
  "use strict";

  var saida = document.getElementById("saida");
  var frame = document.getElementById("frame");
  var linhas = [], falhas = 0;

  function reg(texto, ruim) {
    var li = document.createElement("li");
    li.textContent = texto;
    li.className = ruim ? "bad" : "ok";
    saida.appendChild(li);
    linhas.push((ruim ? "FALHOU " : "PASS ") + texto);
    if (ruim) falhas++;
  }

  function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* Espera a rolagem PARAR, em vez de dormir um tempo fixo.

     Necessário: o componente reagenda sincronizar() 260ms depois do último
     evento de scroll (a rolagem suave continua depois do último evento). Um
     sleep fixo às vezes lê o estado antes disso — este teste chegou a reprovar
     e passar em execuções seguidas com os mesmos 500ms, sem mudança de código.
     Teste instável não serve para nada: ou vira ruído que todo mundo ignora,
     ou manda procurar um defeito que não existe. */
  async function assentar(trilho) {
    var anterior = null;
    for (var i = 0; i < 40; i++) {          // teto de ~2s
      await esperar(50);
      if (trilho.scrollLeft === anterior) {
        await esperar(320);                 // deixa o reagendamento de 260ms cair
        return;
      }
      anterior = trilho.scrollLeft;
    }
  }

  var DESTINOS = [
    "especialidades/implantes.html",
    "especialidades/lentes-de-contato-dental.html",
    "especialidades/harmonizacao-facial.html",
    "especialidades/ortodontia-estetica.html",
    "especialidades/clareamento.html"
  ];

  frame.onload = function () {
    var doc = frame.contentDocument;

    (async function () {
      await esperar(500);

      var raiz = doc.querySelector("[data-carrossel]");
      if (!raiz) { reg("nao achou o carrossel", true); return concluir(); }

      var trilho = raiz.querySelector(".carrossel__trilho");
      var slides = raiz.querySelectorAll(".carrossel__slide");

      reg("achou " + slides.length + " slides (esperado 5)", slides.length !== 5);

      // --- destinos ---
      var destinosOk = true;
      for (var i = 0; i < slides.length; i++) {
        var a = slides[i].querySelector("a.carrossel__link");
        if (!a || a.getAttribute("href") !== DESTINOS[i]) destinosOk = false;
      }
      reg("os 5 slides apontam para as 5 paginas de especialidade", !destinosOk);

      // --- o ponto critico: texto real por tras da imagem ---
      var semTexto = 0, curtos = 0;
      for (var j = 0; j < slides.length; j++) {
        var vh = slides[j].querySelector(".carrossel__legenda");
        if (!vh) { semTexto++; continue; }
        if (vh.textContent.trim().length < 120) curtos++;
      }
      reg("todo slide tem texto real em .carrossel__legenda (faltando: " + semTexto + ")",
          semTexto > 0);
      reg("nenhum desses textos e curto demais para substituir a imagem (" +
          curtos + " curtos)", curtos > 0);

      // --- alt vazio: o conteudo vem do bloco oculto, nao do alt ---
      var altErrado = 0;
      for (var k = 0; k < slides.length; k++) {
        var img = slides[k].querySelector("img");
        if (!img || img.getAttribute("alt") === null) altErrado++;
      }
      reg("toda imagem declara alt (vazio, por ter texto equivalente ao lado)",
          altErrado > 0);

      // --- enriquecimento progressivo ---
      var htmlCru = await (await fetch("../index.html")).text();
      var temHiddenNoHtml =
        /class="carrossel__seta carrossel__seta--ant"[^>]*hidden/.test(htmlCru) ||
        /carrossel__seta--ant[\s\S]{0,120}?hidden/.test(htmlCru);
      reg("controles nascem [hidden] no HTML entregue", !temHiddenNoHtml);

      var btnProx = raiz.querySelector(".carrossel__seta--prox");
      var btnAnt = raiz.querySelector(".carrossel__seta--ant");
      reg("o JS revelou as setas", btnProx.hidden !== false);

      /* [hidden] precisa REALMENTE ocultar, não só ter a propriedade em true.
         O atributo vale display:none apenas na folha do navegador, e perde
         para qualquer display declarado no CSS — aconteceu com os casos de
         Resultados: .hidden respondia true e os elementos seguiam na tela.
         Ler a propriedade não pega isso; ler o display computado, sim. */
      var alvo = doc.createElement("div");
      alvo.style.display = "flex";
      alvo.hidden = true;
      doc.body.appendChild(alvo);
      var ocultou = doc.defaultView.getComputedStyle(alvo).display === "none";
      alvo.remove();
      reg("[hidden] vence um display declarado (reset global)", !ocultou);
      reg("o JS montou os pontos (" +
          raiz.querySelectorAll(".carrossel__ponto").length + ")",
          raiz.querySelectorAll(".carrossel__ponto").length !== 5);

      // --- estado inicial ---
      reg("seta 'anterior' comeca desabilitada", btnAnt.disabled !== true);
      reg("seta 'proxima' comeca habilitada", btnProx.disabled !== false);

      // --- navegacao ---
      var antes = trilho.scrollLeft;
      btnProx.click();
      await assentar(trilho);
      var depois = trilho.scrollLeft;
      reg("clicar em 'proxima' rolou o trilho (" + Math.round(antes) +
          " -> " + Math.round(depois) + ")", depois <= antes);

      var pontoAtivo = raiz.querySelector('.carrossel__ponto[aria-selected="true"]');
      var indiceAtivo = Array.prototype.indexOf.call(
        raiz.querySelectorAll(".carrossel__ponto"), pontoAtivo);
      reg("o ponto ativo acompanhou a rolagem (indice " + indiceAtivo + ")",
          indiceAtivo !== 1);

      reg("seta 'anterior' foi habilitada apos sair do inicio",
          btnAnt.disabled !== false);

      // --- a pagina nao pode ter rolado na vertical junto ---
      // (era o defeito do scrollIntoView, documentado no services.js)
      var topo = doc.documentElement.scrollTop;
      btnProx.click();
      await assentar(trilho);
      reg("navegar no carrossel nao rolou a pagina na vertical",
          Math.abs(doc.documentElement.scrollTop - topo) > 4);

      /* --- REGRESSÃO: ir até o fim e conseguir voltar ---------------------
         Bug relatado pelo usuário e reproduzido no diagnóstico: chegando ao
         último slide, o botão "anterior" continuava marcado como desabilitado
         e engolia o primeiro clique. A causa eram os estados vindos do ÍNDICE
         em vez do limite de rolagem — e, com snap ao centro, o primeiro e o
         último slide não conseguiam centralizar, deixando o índice ambíguo
         justamente nas pontas. */
      trilho.scrollLeft = trilho.scrollWidth;   // vai ao fim de uma vez
      // Atribuir scrollLeft só dispara "scroll" se o valor MUDOU. Se já
      // estivéssemos no fim, nenhum evento sairia e o teste leria estado
      // velho — foi essa a instabilidade que apareceu aqui. O disparo
      // explícito remove a dependência de o navegador ter mudado algo.
      trilho.dispatchEvent(new frame.contentWindow.Event("scroll"));
      await assentar(trilho);

      var maximo = trilho.scrollWidth - trilho.clientWidth;
      reg("chegou de fato ao fim da rolagem", trilho.scrollLeft < maximo - 4);
      reg("no fim, 'proxima' esta desabilitada [scrollLeft=" +
          Math.round(trilho.scrollLeft) + " max=" + Math.round(maximo) + "]",
          btnProx.disabled !== true);
      reg("no fim, 'anterior' esta HABILITADA (era o bug)",
          btnAnt.disabled !== false);

      // o primeiro clique tem que mover — era exatamente ele que sumia
      var noFim = trilho.scrollLeft;
      btnAnt.click();
      await assentar(trilho);
      reg("1o clique em 'anterior' no fim ja move (" + Math.round(noFim) +
          " -> " + Math.round(trilho.scrollLeft) + ")",
          trilho.scrollLeft >= noFim - 4);

      // e daí consegue voltar até o começo
      for (var v = 0; v < 6; v++) {
        if (btnAnt.disabled) break;
        btnAnt.click();
        await assentar(trilho);
      }
      reg("voltou ate o primeiro slide (scrollLeft=" +
          Math.round(trilho.scrollLeft) + ")", trilho.scrollLeft > 4);
      reg("no inicio, 'anterior' voltou a ficar desabilitada",
          btnAnt.disabled !== true);

      await autoTeste(doc, raiz);
      concluir();
    })();

    /* Prova que o harness enxerga. */
    async function autoTeste(doc, raiz) {
      var falso = doc.createElement("li");
      falso.className = "carrossel__slide";
      raiz.querySelector(".carrossel__trilho").appendChild(falso);
      var n = raiz.querySelectorAll(".carrossel__slide").length;
      reg("auto-teste: slide injetado foi detectado (" + n + " != 5)", n === 5);
      falso.remove();
    }

    function concluir() {
      document.title = "RESULTADO " +
        (falhas === 0 ? "TUDO PASSOU" : falhas + " FALHA(S)") +
        " :: " + linhas.join(" | ");
    }
  };
})();
</script>

</body>
</html>
