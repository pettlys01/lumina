<section class="section section--raised" id="espaco">
  <div class="container">

    <div class="section-head reveal">
      <span class="section-head__eyebrow">Nosso espaço</span>
      <h2 class="section-head__title">O lugar onde isso acontece</h2>
      <p class="section-head__lead">
        Ambiente pensado para quem chega tenso: silêncio, luz natural e nenhum
        corredor que pareça hospital.
      </p>
    </div>

    <!-- ==================================================================
         Galeria do espaço.

         Grade estática, sem carrossel nem lightbox. A Home já tem carrossel
         nas Especialidades e comparador arrastável em duas seções; um
         terceiro padrão interativo aqui faria a página parecer uma vitrine de
         componentes. Fotografia de ambiente também não pede interação — ela
         funciona quando é vista de uma vez, em conjunto.

         <ul> porque são seis itens irmãos de mesmo peso, e o leitor de tela
         anuncia a contagem antes de percorrer.
         ================================================================== -->
    <ul class="espaco__grade" data-reveal-group>
      <li class="espaco__item espaco__item--largo">
        <img src="assets/img/espaco-1.jpg"
             alt="Recepção da clínica, com assentos baixos e luz natural"
             width="1400" height="1050" loading="lazy" decoding="async">
      </li>
      <li class="espaco__item">
        <img src="assets/img/espaco-2.jpg"
             alt="Corredor de acesso aos consultórios"
             width="1400" height="1050" loading="lazy" decoding="async">
      </li>
      <li class="espaco__item">
        <img src="assets/img/espaco-3.jpg"
             alt="Sala de atendimento, com cadeira e janela ao fundo"
             width="1400" height="1050" loading="lazy" decoding="async">
      </li>
      <li class="espaco__item">
        <img src="assets/img/espaco-4.jpg"
             alt="Sala de planejamento digital, com monitor de tomografia"
             width="1400" height="1050" loading="lazy" decoding="async">
      </li>
      <li class="espaco__item">
        <img src="assets/img/espaco-5.jpg"
             alt="Central de esterilização, com bancada e equipamentos"
             width="1400" height="1050" loading="lazy" decoding="async">
      </li>
      <li class="espaco__item espaco__item--total">
        <img src="assets/img/espaco-6.jpg"
             alt="Vista ampla do ambiente da clínica"
             width="1900" height="815" loading="lazy" decoding="async">
      </li>
    </ul>

  </div>
</section>
