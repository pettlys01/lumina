    <!-- Quatro itens de topo. Hick's Law: o tempo de decisão cresce com o
         número de opções, então a navegação principal carrega só as categorias
         de alto nível — o resto do site é alcançado por dentro delas.

         Âncoras sempre prefixadas com "index.html": este partial é incluído
         também em páginas que não são a Home (especialidades, contato), onde
         um "#especialidades" sozinho não aponta para lugar nenhum — a seção
         só existe na Home. Com o prefixo, o link funciona em qualquer página;
         na própria Home, o navegador resolve para o mesmo documento e apenas
         rola, sem recarregar. -->
    <nav class="navbar__nav" id="navbar-menu" aria-label="Principal">
