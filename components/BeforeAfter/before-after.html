<section class="section" id="antes-depois">
  <div class="container">

    <div class="section-head">
      <span class="section-head__eyebrow">Como registramos seu caso</span>
      <h2 class="section-head__title">Do molde físico ao plano digital</h2>
      <p class="section-head__lead">
        Isto não é o resultado de um paciente — é o método. Arraste para
        comparar a moldagem física tradicional com a visualização do plano
        gerado a partir do escaneamento digital.
      </p>
    </div>

    <!-- Esta seção já foi "Antes e Depois" de resultado de tratamento. Mudou
         de conteúdo por uma razão regulatória real: a Resolução CFO 196/2019
         libera antes/depois para o cirurgião-dentista pessoa física, mas o
         CROSP é explícito que isso NÃO se estende a clínicas — para pessoa
         jurídica, publicar antes/depois de paciente segue vedado como
         publicidade comercial. Lumina é clínica. A comparação de método
         (moldagem × plano digital) entrega a mesma mecânica de slider sem
         entrar na parte vedada, e ainda reforça o posicionamento real da
         marca (Seção 3 do Bible: confiança por transparência de processo). -->
    <figure class="ba">
      <div class="ba__stage" data-ba>

        <img class="ba__img" src="assets/img/plano-digital.svg"
             alt="Ilustração esquemática do plano digital do sorriso, com marcadores ao longo do arco dentário"
             width="1200" height="675" loading="lazy" decoding="async">

        <div class="ba__overlay">
          <img class="ba__img" src="assets/img/moldagem.jpg"
               alt="Modelo de gesso obtido por moldagem convencional, fotografado sobre fundo neutro"
               width="1400" height="933" loading="lazy" decoding="async">
        </div>

        <span class="ba__tag ba__tag--fisico" aria-hidden="true">Moldagem</span>
        <span class="ba__tag ba__tag--digital" aria-hidden="true">Plano digital</span>

        <span class="ba__line" aria-hidden="true"></span>

        <!-- Um <input type="range"> nativo em vez de um handle improvisado: dá
             teclado (setas, Home/End), leitor de tela e suporte a toque sem
             reimplementar nada. O visual é todo do thumb. -->
        <input class="ba__range" type="range" min="0" max="100" value="50" step="1"
               data-ba-range
               aria-label="Comparar moldagem física e plano digital — arraste, ou use as setas do teclado">
      </div>

      <figcaption class="ba__caption">
        Mesmo caso, dois registros: o molde de gesso enviado ao laboratório e a
        prévia gerada a partir do escaneamento intraoral, usada para planejar o
        tratamento antes do primeiro procedimento.
      </figcaption>
    </figure>

  </div>
</section>
