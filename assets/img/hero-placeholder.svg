<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Espaço de recepção da clínica, com luz natural suave">
  <title>Placeholder — recepção da clínica</title>

  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#EFEAE1"/>
      <stop offset="0.55" stop-color="#DED6C8"/>
      <stop offset="1" stop-color="#BEB2A0"/>
    </linearGradient>

    <linearGradient id="piso" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#B4A692"/>
      <stop offset="1" stop-color="#8E8271"/>
    </linearGradient>

    <radialGradient id="luz" cx="0.26" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#FFFBF2" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFF6E8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFF6E8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="feixe" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFDF7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFDF7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vinheta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3123" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A3123" stop-opacity="0.28"/>
    </linearGradient>

    <filter id="grao">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- parede de fundo -->
  <rect width="1600" height="1000" fill="url(#parede)"/>

  <!-- piso, com linha de horizonte baixa (pé-direito alto) -->
  <rect y="720" width="1600" height="280" fill="url(#piso)"/>

  <!-- janela alta à esquerda: a fonte da luz -->
  <rect x="96" y="90" width="286" height="600" fill="#FCF8EF" opacity="0.72"/>
  <rect x="96" y="90" width="286" height="600" fill="none" stroke="#9C8F7C" stroke-width="3" opacity="0.5"/>
  <line x1="239" y1="90" x2="239" y2="690" stroke="#9C8F7C" stroke-width="2" opacity="0.45"/>
  <line x1="96" y1="390" x2="382" y2="390" stroke="#9C8F7C" stroke-width="2" opacity="0.45"/>

  <!-- feixe de luz projetado da janela até o piso -->
  <polygon points="382,150 900,720 382,720" fill="url(#feixe)"/>

  <!-- painel vertical à direita: madeira clara, quebra a parede lisa -->
  <rect x="1130" y="0" width="340" height="720" fill="#C9B79C" opacity="0.55"/>
  <line x1="1130" y1="0" x2="1130" y2="720" stroke="#8E8271" stroke-width="2" opacity="0.4"/>

  <!-- balcão de recepção, em silhueta suave -->
  <rect x="980" y="560" width="520" height="160" rx="4" fill="#A2947F" opacity="0.65"/>
  <rect x="980" y="560" width="520" height="14" rx="4" fill="#E6DDCE" opacity="0.8"/>

  <!-- banco baixo à esquerda -->
  <rect x="180" y="640" width="300" height="12" rx="6" fill="#8E8271" opacity="0.75"/>
  <rect x="210" y="652" width="10" height="68" fill="#8E8271" opacity="0.6"/>
  <rect x="440" y="652" width="10" height="68" fill="#8E8271" opacity="0.6"/>

  <!-- reflexo do feixe no piso -->
  <polygon points="382,720 900,720 760,1000 300,1000" fill="#FFFDF7" opacity="0.14"/>

  <!-- bloom de luz por cima de tudo -->
  <rect width="1600" height="1000" fill="url(#luz)"/>

  <!-- vinheta inferior: garante contraste do painel de texto sobre a imagem -->
  <rect width="1600" height="1000" fill="url(#vinheta)"/>

  <!-- grão sutil, para não parecer vetor chapado -->
  <rect width="1600" height="1000" filter="url(#grao)" opacity="0.05"/>
</svg>
